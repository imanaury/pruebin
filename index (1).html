<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PRUEBIN</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:wght@500;700&family=Public+Sans:wght@400;600&display=swap">
<style>
:root{--bg:#f6f2f8;--surface:#fff;--ink:#1d1630;--muted:#625778;--line:#d9d0e6;--hema:#4a2c86;--on-hema:#fff;--eosin:#c93c76;--ok:#1f7a55;--bad:#b3261e;--sel:#ece4fa;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#150f24;--surface:#1f1733;--ink:#f1ecfa;--muted:#a99fc0;--line:#3a2f57;--hema:#b79cf2;--on-hema:#1a1030;--eosin:#ff7aa8;--ok:#5fd6a0;--bad:#ff8b84;--sel:#33264f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#150f24;--surface:#1f1733;--ink:#f1ecfa;--muted:#a99fc0;--line:#3a2f57;--hema:#b79cf2;--on-hema:#1a1030;--eosin:#ff7aa8;--ok:#5fd6a0;--bad:#ff8b84;--sel:#33264f;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "Public Sans",system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:24px 18px 40px}
h1,h2{font-family:"Newsreader",Georgia,serif;line-height:1.15;margin:0}
h1{font-size:2.1rem;font-weight:700;margin-bottom:10px}
h2{font-size:1.5rem;font-weight:500;margin:18px 0 14px}
p{margin:0 0 14px;color:var(--muted)}
label{display:block;font-weight:600;margin-bottom:6px}
input{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--eosin);outline-offset:2px}
.btn{width:100%;padding:14px;border:0;border-radius:10px;background:var(--hema);color:var(--on-hema);font-weight:600;margin-top:16px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--hema);border:1.5px solid var(--hema)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--eosin);transition:width .25s}
.count{font-size:.9rem;color:var(--muted);margin:8px 0 14px}
figure{margin:0;display:flex;justify-content:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}
figure img{max-width:100%;max-height:44vh;object-fit:contain;border-radius:6px}
figure img.round{border-radius:50%}
.opts{display:grid;gap:10px;padding:0;margin:0;list-style:none}
.opt{width:100%;display:flex;gap:12px;align-items:center;text-align:left;padding:13px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.opt b{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--hema);color:var(--hema);font-size:.9rem}
.opt[aria-pressed=true]{background:var(--sel);border-color:var(--hema)}
.opt[aria-pressed=true] b{background:var(--hema);color:var(--on-hema)}
.nav{display:grid;grid-template-columns:1fr 2fr;gap:10px}
.score{font:700 3.4rem/1 "Newsreader",Georgia,serif;color:var(--hema);margin:14px 0 4px}
.rev{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);margin-bottom:10px}
.rev img{width:72px;height:72px;object-fit:cover;border-radius:6px;flex:none}
.rev p{margin:0;font-size:.92rem}
.bad{color:var(--bad)}.ok{color:var(--ok)}
.credit{text-align:center;font-size:.85rem;margin:28px 0 0}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<main>
<section id="intro">
  <h1>PRUEBIN</h1>
  <p>Identificación de láminas histológicas. Observa cada imagen y elige la opción correcta (A a D). <span id="n"></span> preguntas, una sola respuesta por pregunta.</p>
  <label for="nm">Nombre del estudiante</label>
  <input id="nm" autocomplete="name">
  <p id="att" style="margin:10px 0 0"></p>
  <button class="btn" id="go" disabled>Comenzar examen</button>
</section>

<section id="quiz" hidden>
  <div class="bar"><i id="fill"></i></div>
  <div class="count" id="cnt"></div>
  <figure><img id="img" alt="Lámina histológica"></figure>
  <h2>¿Qué se observa?</h2>
  <ul class="opts" id="opts"></ul>
  <div class="nav">
    <button class="btn ghost" id="prev">Anterior</button>
    <button class="btn" id="next">Siguiente</button>
  </div>
</section>

<section id="result" hidden>
  <h1>Resultado</h1>
  <p id="who"></p>
  <div class="score" id="sc"></div>
  <p id="pc"></p>
  <h2 id="rvt"></h2>
  <div id="rv"></div>
  <button class="btn" id="again">Repetir examen</button>
</section>
<p class="credit">Creado por Manauri Aybar</p>
</main>

const P={
  T:['Cartílago hialino','Cartílago elástico','Fibrocartílago','Hueso compacto','Hueso esponjoso (médula ósea)','Médula ósea roja','Tejido sanguíneo'],
  B:['Basófilo','Eosinófilo','Neutrófilo','Linfocito','Monocito','Eritrocitos']
};
const L='ABCD';
let qs=[],i=0;
const $=id=>document.getElementById(id);
const sh=a=>{a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a};
function show(id){['intro','quiz','result'].forEach(s=>$(s).hidden=s!==id);window.scrollTo(0,0)}
$('n').textContent=Q.length;
const MAX=10;
const REGISTRO='https://script.google.com/macros/s/AKfycbxyQwdbGKX8QqP5dxreHKWraJjK1-5nciFWcwyTuz36bEcNrRtHLLg7Hxl1MwezRmAv/exec';
const key=()=>'intentos:'+$('nm').value.trim().toLowerCase().replace(/\s+/g,' ');
function used(){try{return parseInt(localStorage.getItem(key())||'0',10)||0}catch(e){return 0}}
function upd(){
  const a=$('att');
  if(!$('nm').value.trim()){a.textContent='';$('go').disabled=true;return}
  const left=MAX-used();
  a.textContent=left>0?'Intentos disponibles: '+left+' de '+MAX+'.':'Ya usaste tus '+MAX+' intentos.';
  $('go').disabled=left<=0;
}
$('nm').addEventListener('input',upd);
function start(){
  if(used()>=MAX){upd();show('intro');return}
  try{localStorage.setItem(key(),String(used()+1))}catch(e){}
  qs=sh(Q).map(q=>{
    const d=sh(P[q.g].filter(x=>x!==q.a&&!(q.x||[]).includes(x))).slice(0,3);
    return {...q,o:sh([q.a,...d]),r:null};
  });
  i=0;render();show('quiz');
}
function render(){
  const q=qs[i];
  $('cnt').textContent='Pregunta '+(i+1)+' de '+qs.length+'. Intento '+used()+' de '+MAX+'.';
  $('fill').style.width=(i/qs.length*100)+'%';
  const im=$('img');im.src=q.i;im.className=q.c?'round':'';
  const ul=$('opts');ul.innerHTML='';
  q.o.forEach((t,k)=>{
    const li=document.createElement('li'),b=document.createElement('button'),s=document.createElement('b'),sp=document.createElement('span');
    b.type='button';b.className='opt';b.setAttribute('aria-pressed',String(q.r===t));
    s.textContent=L[k];sp.textContent=t;b.append(s,sp);
    b.onclick=()=>{q.r=t;ul.querySelectorAll('.opt').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));$('next').disabled=false};
    li.append(b);ul.append(li);
  });
  $('prev').disabled=i===0;
  $('next').disabled=q.r===null;
  $('next').textContent=i===qs.length-1?'Finalizar examen':'Siguiente';
}
function finish(){
  const ok=qs.filter(q=>q.r===q.a).length,n=qs.length;
  if(REGISTRO){try{fetch(REGISTRO,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify({nombre:$('nm').value.trim(),aciertos:ok,total:n,porcentaje:Math.round(ok/n*100),intento:used()})}).catch(()=>{})}catch(e){}}
  $('who').textContent=$('nm').value.trim();
  $('sc').textContent=ok+' de '+n;
  $('pc').textContent=Math.round(ok/n*100)+' % de aciertos';
  const bad=qs.filter(q=>q.r!==q.a),box=$('rv');
  box.innerHTML='';
  $('rvt').textContent=bad.length?'Para repasar':'Sin errores';
  bad.forEach(q=>{
    const d=document.createElement('div'),im=document.createElement('img'),t=document.createElement('div'),a=document.createElement('p'),c=document.createElement('p');
    d.className='rev';im.src=q.i;im.alt='';
    a.className='bad';a.textContent='Tu respuesta: '+q.r;
    c.className='ok';c.textContent='Correcta: '+q.a;
    t.append(a,c);d.append(im,t);box.append(d);
  });
  const left=MAX-used();
  $('again').disabled=left<=0;
  $('again').textContent=left>0?'Repetir examen ('+left+' intentos restantes)':'Sin intentos disponibles';
  show('result');
}
$('go').onclick=start;
$('again').onclick=start;
$('prev').onclick=()=>{if(i>0){i--;render()}};
$('next').onclick=()=>{if(i<qs.length-1){i++;render();window.scrollTo(0,0)}else finish()};
</script>
